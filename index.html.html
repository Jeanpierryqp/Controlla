    <h3>Novo orçamento · ${monthName(viewYM().m)}/${viewYM().y}</h3>

function saveBudget(){
  const d = currentData(); const now = new Date();
  const category = document.getElementById('bCat').value;
  const limitVal = parseFloat(document.getElementById('bLimit').value); if(!limitVal || limitVal<=0) return alert('Informe um limite válido.');
  const {y:year, m:month} = viewYM();
  const existing = d.budgets.find(b=>b.category===category && b.month===month && b.year===year);
  if(existing) existing.limitVal = limitVal;
  else d.budgets.push({id:uid(),category,limitVal,month,year});

function deleteBudget(id){ withUndo('Orçamento excluído', ()=>{ const d=currentData(); d.budgets=d.budgets.filter(b=>b.id!==id); persist(); render(); }); }

/* Ritmo de aportes (R$/mês): saldo líquido dos últimos 90 dias, dividido pelo tempo desde o 1º aporte (entre 1 e 3 meses) */
function goalPace(g){
  const deps=g.deposits||[]; if(!deps.length) return null;
  const today=todayISO(), since=plusDaysISO(today,-90);
  const recent=deps.filter(x=>x.date>=since && x.date<=today); if(!recent.length) return null;
  const net=recent.reduce((s,x)=>s+x.amount,0); if(net<=0) return null;
  const first=deps.reduce((a,x)=>x.date<a?x.date:a, deps[0].date);
  const spanDays=Math.max(30, Math.min(90, -daysUntil(first)));
  return net/(spanDays/30.4);
}
function goalCardHtml(g){
  const cur=g.currentAmount||0, target=g.targetAmount, rem=target-cur;
  const pct=Math.max(0,Math.min(100,cur/target*100));
  const deps=(g.deposits||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const pace=goalPace(g), lines=[];
  if(rem<=0) lines.push('<span class="up">Meta atingida</span>');
  else {
    lines.push('Faltam '+fmtMoney(rem));
    if(pace){ const months=Math.ceil(rem/pace), n=nowYM(), eta=new Date(n.y,n.m-1+months,1);
      lines.push('No ritmo atual ('+fmtMoney(pace)+'/mês): '+(months===1?'1 mês':months+' meses')+' · '+monthName(eta.getMonth()+1)+'/'+eta.getFullYear()); }
    else lines.push('Faça aportes para estimar quando você chega lá');
    if(g.deadline){
      const dl=daysUntil(g.deadline);
      if(dl<0) lines.push('<span class="down">Prazo vencido</span>');
      else { const need=rem/Math.max(1,Math.ceil(dl/30.4));
        lines.push('Para chegar até '+fmtDate(g.deadline)+': '+fmtMoney(need)+'/mês'+(pace ? (pace>=need ? ' <span class="up">· no caminho</span>' : ' <span class="down">· faltam '+fmtMoney(need-pace)+'/mês</span>') : '')); }
    }
  }
  return `<div style="margin-bottom:18px" data-goal="${g.id}">
    <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px">
      <span style="min-width:0;overflow-wrap:anywhere">${escapeHtml(g.name)}${g.deadline?` · até ${fmtDate(g.deadline)}`:''}</span><span style="white-space:nowrap">${fmtMoney(cur)} / ${fmtMoney(target)}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:var(--sage-500)"></div></div>
    <div class="small-muted" style="margin-top:6px">${lines.map(l=>`<div>${l}</div>`).join('')}</div>
    ${deps.length ? `<details style="margin-top:6px"><summary class="small-muted" style="cursor:pointer">Histórico (${deps.length})</summary>
      ${deps.map(x=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--ink-850)">
        <span style="flex:1;min-width:0;overflow-wrap:anywhere">${fmtDate(x.date)}${x.note?' · '+escapeHtml(x.note):''}</span>
        <b class="${x.amount>=0?'up':'down'}" style="white-space:nowrap">${x.amount>=0?'+':'−'} ${fmtMoney(Math.abs(x.amount))}</b>
        <button class="iconbtn sm" onclick="deleteDeposit('${g.id}','${x.id}')" aria-label="Excluir lançamento" title="Excluir">${IC.del}</button></div>`).join('')}</details>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:6px">
      <button class="iconbtn" onclick="addToGoal('${g.id}')">+ Aportar</button>
      <button class="iconbtn" onclick="openGoalModal('${g.id}')" aria-label="Editar meta" title="Editar">${IC.edit}</button>
      <button class="iconbtn" onclick="deleteGoal('${g.id}')" aria-label="Excluir meta" title="Excluir">${IC.del}</button>
    </div>
  </div>`;
}
function openGoalModal(id){
  const d=currentData(); const g=id ? d.goals.find(x=>x.id===id) : null; if(id && !g) return;
  openModal(`
    <h3>${id?'Editar meta':'Nova meta'}</h3>
    <div class="field"><label>Nome</label><input id="gName" placeholder="Ex: Viagem" value="${escapeHtml(g?g.name:'')}"></div>
    <div class="formgrid">
      <div class="field"><label>Valor alvo</label><input id="gTarget" type="number" inputmode="decimal" step="0.01" value="${g?g.targetAmount:''}"></div>
      ${id ? '' : '<div class="field"><label>Valor atual</label><input id="gCurrent" type="number" inputmode="decimal" step="0.01" value="0"></div>'}
    </div>
    <div class="field"><label>Prazo (opcional)</label><input id="gDeadline" type="date" value="${g&&g.deadline?g.deadline:''}"></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveGoal('${id||''}')">Salvar</button></div>`);
}
function saveGoal(id){
  const d = currentData();
  const name = document.getElementById('gName').value.trim(); if(!name) return;
  const targetAmount = parseFloat(document.getElementById('gTarget').value); if(!targetAmount||targetAmount<=0) return alert('Informe um valor alvo válido.');
  const deadline = document.getElementById('gDeadline').value || null;
  if(id){
    const g=d.goals.find(x=>x.id===id); if(!g) return closeModal();
    Object.assign(g,{name,targetAmount,deadline});
  } else {
    const currentAmount = parseFloat(document.getElementById('gCurrent').value)||0;
    d.goals.push({id:uid(),name,targetAmount,currentAmount,deadline,deposits:[]});
  }
  persist(); closeModal(); render();
}
function addToGoal(id){
  openModal(`
    <h3>Movimentar meta</h3>
    <div class="formgrid">
      <div class="field"><label>Tipo</label><select id="goalKind"><option value="in">Aporte (guardei)</option><option value="out">Retirada (usei)</option></select></div>
      <div class="field"><label>Valor</label><input id="goalAdd" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></div>
      <div class="field"><label>Data</label><input id="goalDate" type="date" value="${todayISO()}"></div>
      <div class="field"><label>Observação (opcional)</label><input id="goalNote" placeholder="Ex: 13º salário"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveGoalAdd('${id}')">Salvar</button></div>`);
}
function saveGoalAdd(id){
  const n = parseFloat(document.getElementById('goalAdd').value);
  if(!n || n<=0) return alert('Informe um valor válido.');
  const d = currentData(); const g = d.goals.find(x=>x.id===id); if(!g) return;
  const out = document.getElementById('goalKind').value==='out';
  if(out && n>(g.currentAmount||0)) return alert('A retirada é maior do que o valor guardado na meta.');
  const date = document.getElementById('goalDate').value || todayISO();
  const note = document.getElementById('goalNote').value.trim();
  const amount = out ? -n : n;
  (g.deposits = g.deposits || []).push({id:uid(),date,amount,note});
  g.currentAmount = (g.currentAmount||0) + amount;
  persist(); closeModal(); render();
}
function deleteDeposit(goalId, depId){
  const d=currentData(); const g=d.goals.find(x=>x.id===goalId); if(!g) return;
  const dep=(g.deposits||[]).find(x=>x.id===depId); if(!dep) return;
  withUndo('Lançamento da meta excluído', ()=>{
    g.deposits=g.deposits.filter(x=>x.id!==depId);
    g.currentAmount=Math.max(0,(g.currentAmount||0)-dep.amount);
    persist(); render();
  });
}
function deleteGoal(id){ if(!confirm('Excluir esta meta e o histórico dela?')) return; withUndo('Meta excluída', ()=>{ const d=currentData(); d.goals=d.goals.filter(g=>g.id!==id); persist(); render(); }); }

/* ---------- Backup (os dados ficam só neste navegador; use para levar do PC ao celular) ---------- */
function dbMeta(){
  if(!DB.meta || typeof DB.meta!=='object') DB.meta={};
  if(!DB.meta.createdAt){ DB.meta.createdAt=new Date().toISOString(); saveDb(DB); }
  return DB.meta;
}
function markBackupDone(){ const m=dbMeta(); m.lastBackup=new Date().toISOString(); delete m.snoozeUntil; persist(); }
function backupDaysSince(){ const m=dbMeta(); return -daysUntil(isoFromDate(new Date(m.lastBackup||m.createdAt))); }
function snoozeBackup(){ dbMeta().snoozeUntil=plusDaysISO(todayISO(),7); persist(); render(); }
function backupReminderHtml(){
  const d=currentData(); if(!d.accounts.length && !d.transactions.length && !d.cards.length) return '';
  const m=dbMeta(); if(m.snoozeUntil && todayISO()<m.snoozeUntil) return '';
  const days=backupDaysSince(); if(days<30) return '';
  const msg = m.lastBackup ? 'Seu último backup foi há '+days+' dias.' : 'Você ainda não fez nenhum backup.';
  return `<div class="card" id="backupReminder" style="margin-bottom:16px;border-color:var(--gold-500)">
    <div style="font-weight:700">Hora de fazer um backup</div>
    <div class="small-muted" style="margin:4px 0 12px">${msg} Seus dados ficam só neste navegador: se limpar o cache ou trocar de aparelho, eles se perdem.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" style="width:auto;padding:10px 16px" onclick="exportBackup()">Fazer backup agora</button><button class="btn btn-outline" style="width:auto;padding:10px 16px" onclick="snoozeBackup()">Lembrar em 7 dias</button></div>
  </div>`;
}
function exportBackup(){
  markBackupDone();
  const blob = new Blob([JSON.stringify({app:'controlla', version:1, exportedAt:new Date().toISOString(), db:DB})], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'controlla-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  if(currentUser()) render();
}
function importBackup(){ document.getElementById('importFile').click(); }
function onImportFile(ev){
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    let db;
    try{
      const j = JSON.parse(r.result); db = j.db || j;
      if(!db || !Array.isArray(db.users) || !db.data || typeof db.data!=='object') throw new Error('formato');
    }catch(e){ return alert('Arquivo de backup inválido.'); }
    if(!confirm('Importar este backup vai SUBSTITUIR todos os dados guardados neste navegador. Continuar?')) return;
    DB = db; markBackupDone(); closeDrawer(); closeModal();
    if(!currentUser()){ logout(); alert('Backup importado. Entre com a conta que você usava.'); }
    else { enterApp(); render(); alert('Backup importado.'); }
  };
  r.readAsText(f);
}

/* ---------- Teclado (Enter / Esc) e redimensionamento ---------- */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); closeDrawer(); return; }
  if(e.key!=='Enter' || e.isComposing) return;
  const t = e.target;
  if(!t || t.tagName!=='INPUT') return;
  const go = id => { e.preventDefault(); document.getElementById(id).focus(); };
  if(t.id==='loginId') return go('loginPass');
  if(t.id==='loginPass'){ e.preventDefault(); return doLogin(); }
  if(t.id==='regName') return go('regId');
  if(t.id==='regId') return go('regPass');
  if(t.id==='regPass'){ e.preventDefault(); return doRegister(); }
  if(t.closest && t.closest('.modal')){ const b = document.querySelector('.modal .btn-primary'); if(b){ e.preventDefault(); b.click(); } }
});
(function(){
  if(!window.matchMedia) return;
  const mq = window.matchMedia('(min-width:861px)');
  const fn = ev => { if(ev.matches) closeDrawer(); }; // girou o aparelho / redimensionou: fecha o menu lateral
  if(mq.addEventListener) mq.addEventListener('change', fn); else if(mq.addListener) mq.addListener(fn);
})();

/* ---------- boot ---------- */
(function boot(){
  if(currentUser()) enterApp();
})();
</script>
