  --parchment:#F4F1EA; --gold-400:#E4C77A; --gold-500:#C9A227; --gold-600:#A9861F;
  --sage-400:#8FBE9C; --sage-500:#6FA57F; --coral-400:#E8927C; --coral-500:#D8674C; --muted:#8A94A6;
  --radius:14px; --bar-w:14px; --on-gold:#0B1118;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ink-950:#F5F1E8; --ink-900:#FFFFFF; --ink-850:#F2EEE4; --ink-800:#EAE4D6; --ink-700:#D6CEBB; --ink-600:#BDB39B;
  --parchment:#1B2230; --gold-400:#8A6A0F; --gold-500:#C9A227; --gold-600:#A9861F;
  --sage-400:#2F7A4C; --sage-500:#4C9A6A; --coral-400:#B8452D; --coral-500:#D8674C; --muted:#667085;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{margin:0;background:var(--ink-950);color:var(--parchment);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;min-height:100dvh;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);touch-action:manipulation;-webkit-font-smoothing:antialiased;}
body.noscroll{overflow:hidden;}
h1,h2,h3,.display{font-family:Fraunces,Georgia,serif;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
input,select{font-family:inherit;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--ink-700);border-radius:8px;}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px;}
.svgi{width:18px;height:18px;flex:none;display:block;}

/* ---------- Auth screens ---------- */
#authScreen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:100%;max-width:380px;background:var(--ink-900);border:1px solid var(--ink-700);border-radius:20px;padding:32px 28px;}
.auth-badge{width:64px;height:64px;border-radius:16px;background:var(--ink-900);border:1px solid var(--ink-700);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;overflow:hidden;}
.auth-badge img{width:100%;height:100%;object-fit:cover;}
.auth-title{text-align:center;font-size:22px;font-weight:700;margin:0 0 4px;}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.field input,.field select{width:100%;min-height:42px;padding:11px 12px;border-radius:10px;background:var(--ink-850);border:1px solid var(--ink-700);color:var(--parchment);font-size:14px;outline:none;}
.field input:focus,.field select:focus{border-color:var(--gold-500);}
.field input[type=date]{display:block;-webkit-appearance:none;appearance:none;}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;}
.tabs{display:flex;gap:6px;background:var(--ink-850);border-radius:10px;padding:4px;margin-bottom:16px;}
.tabs button{flex:1;padding:8px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;}
.tabs button.active{background:var(--ink-700);color:var(--parchment);}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;font-weight:600;font-size:14px;text-align:center;}
.btn-primary{background:var(--gold-500);color:var(--on-gold);}
.btn-outline{background:transparent;border:1px solid var(--ink-700);color:var(--parchment);}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--ink-700);}
.err{background:rgba(216,103,76,.15);border:1px solid var(--coral-500);color:var(--coral-400);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}

/* ---------- App shell ---------- */
#appShell{display:flex;min-height:100vh;min-height:100dvh;}
#sidebar{width:230px;flex:none;background:var(--ink-900);border-right:1px solid var(--ink-800);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;}
.brand-badge{width:36px;height:36px;border-radius:10px;overflow:hidden;background:var(--ink-900);border:1px solid var(--ink-700);flex:none;}
.brand-badge img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;}
.navlink{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px;}
.navlink.active{background:var(--ink-800);color:var(--gold-400);}
.navlink .ic{display:inline-flex;align-items:center;justify-content:center;width:18px;}
#sidebar .spacer{flex:1;min-height:12px;}
.userbox{border-top:1px solid var(--ink-800);padding-top:14px;font-size:12px;color:var(--muted);}
.userbox b{color:var(--parchment);display:block;font-size:13px;margin-bottom:6px;}
.logoutbtn{margin-top:8px;width:100%;padding:8px;border-radius:8px;background:var(--ink-800);border:1px solid var(--ink-700);color:var(--muted);font-size:12px;}

#main{flex:1;min-width:0;padding:28px 32px;max-width:100%;overflow-x:hidden;}
#pageContent{max-width:1200px;margin:0 auto;}
.page-title{font-size:24px;font-weight:700;margin:0 0 2px;}
.page-sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
.topbar-mobile{display:none;}
#bottomNav{display:none;}

/* ---------- Generic components ---------- */
.grid{display:grid;gap:16px;}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px;}
.card{background:var(--ink-900);border:1px solid var(--ink-800);border-radius:var(--radius);padding:18px;}
.kpi .kpi-label{font-size:12px;color:var(--muted);margin-bottom:8px;}
.kpi .kpi-value{font-size:22px;font-weight:700;font-family:Fraunces,Georgia,serif;overflow-wrap:anywhere;}
.kpi .kpi-delta{font-size:12px;margin-top:6px;}
.up{color:var(--sage-400);} .down{color:var(--coral-400);}
.two-col{grid-template-columns:1.4fr 1fr;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.section-title{font-size:16px;font-weight:700;margin:0;}

.tx-table{overflow-x:auto;}
.tx-cards{display:none;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--ink-800);}
td{padding:10px;border-bottom:1px solid var(--ink-850);vertical-align:middle;}
.tx-card{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ink-850);}
.tx-card:last-child{border-bottom:none;}
.tx-main{min-width:0;flex:1;}
.tx-desc{font-weight:600;font-size:14px;overflow-wrap:anywhere;}
.tx-meta{color:var(--muted);font-size:12px;margin-top:3px;overflow-wrap:anywhere;}
.tx-side{text-align:right;flex:none;}
.tx-amount{font-weight:700;font-size:14px;white-space:nowrap;}
.tx-actions{margin-top:8px;display:flex;gap:6px;justify-content:flex-end;}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.pill-income{background:rgba(143,190,156,.15);color:var(--sage-400);}
.pill-expense{background:rgba(232,146,124,.15);color:var(--coral-400);}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink-800);border:1px solid var(--ink-700);border-radius:8px;padding:6px 9px;color:var(--muted);font-size:12px;}
.iconbtn .svgi{width:15px;height:15px;}
.chip{background:var(--ink-800);border:1px solid var(--ink-700);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--parchment);}
.chip.gold{background:var(--gold-500);color:var(--on-gold);border-color:var(--gold-500);}
.pill-transfer{background:rgba(228,199,122,.14);color:var(--gold-400);}
.txfilter{margin-bottom:14px;padding:12px 14px;}
.txf-row{display:flex;gap:8px;align-items:center;}
.txf-row input[type=search]{flex:1;min-width:0;min-height:42px;padding:10px 12px;border-radius:10px;background:var(--ink-850);border:1px solid var(--ink-700);color:var(--parchment);font-size:14px;outline:none;font-family:inherit;}
.txf-row input[type=search]:focus{border-color:var(--gold-500);}
.txfilter summary{cursor:pointer;font-size:13px;color:var(--muted);margin-top:10px;user-select:none;}
.txfilter details[open] summary{color:var(--gold-400);margin-bottom:12px;}
.txfilter .chk{display:flex;gap:8px;align-items:center;font-size:13px;min-height:42px;color:var(--parchment);}
.txfilter .chk input{width:auto;min-height:0;}
@media(max-width:860px){ .txf-row input[type=search]{font-size:16px;} }
.rem-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--ink-850);color:inherit;font:inherit;cursor:pointer;}
.rem-row:last-of-type{border-bottom:0;}
.rem-row b{font-weight:600;}
.prefbar{display:flex;gap:6px;margin:0 0 8px;}
.prefbar .iconbtn{flex:1;font-size:11.5px;}
.topbar-mobile .prefbar{margin:0;}
.topbar-mobile .prefbar .iconbtn{flex:none;}
#undoToast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink-800);color:var(--parchment);border:1px solid var(--ink-600);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100vw - 24px);}
#undoToast button{background:none;border:0;color:var(--gold-400);font-weight:700;font-size:13.5px;padding:8px 10px;cursor:pointer;}
#undoToast button.x{color:var(--muted);font-size:20px;line-height:1;padding:4px 10px;}
@media(max-width:860px){ #undoToast{bottom:calc(76px + env(safe-area-inset-bottom,0px));} }
.iconbtn.sm{padding:3px 6px;border-radius:7px;}
.iconbtn.sm .svgi{width:14px;height:14px;}
@media(pointer:coarse){ .iconbtn.sm{min-width:36px;min-height:36px;} }
.monthbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-8px 0 16px;}
.monthbar .chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--parchment);}
.monthbar .chk input{width:auto;}
.repsel{background:var(--ink-800);border:1px solid var(--ink-700);border-radius:10px;padding:9px 11px;color:var(--parchment);font-size:13.5px;font-weight:600;min-height:38px;}
@media(pointer:coarse){ .repsel{min-height:44px;} }
.rep-wrap{overflow-x:auto;}
.rep-table{min-width:520px;}
.rep-table td,.rep-table th{white-space:nowrap;text-align:right;}
.rep-table td:first-child,.rep-table th:first-child{text-align:left;position:sticky;left:0;background:var(--ink-900);}
.rep-table tr.sum td{font-weight:700;border-top:1px solid var(--ink-700);}
.print-only{display:none;}
@media print{
  @page{margin:14mm;}
  body{background:#fff !important;color:#111 !important;}
  #sidebar,.topbar-mobile,#bottomNav,.no-print,#modalRoot,#drawerRoot,#monthPopRoot,#undoToast{display:none !important;}
  #main{margin:0 !important;padding:0 !important;width:100% !important;max-width:none !important;}
  #pageContent{max-width:none !important;}
  .print-only{display:block !important;}
  .card{background:#fff !important;border:1px solid #cfd4dc !important;color:#111 !important;box-shadow:none !important;break-inside:avoid;}
  .kpi-label,.small-muted,th{color:#555 !important;}
  td,th{border-color:#e1e4ea !important;color:#111 !important;background:#fff !important;}
  .up{color:#1a7f37 !important;} .down{color:#b42318 !important;}
  .page-title,.kpi-value{color:#111 !important;}
  .rep-wrap{overflow:visible !important;}
  .rep-table{min-width:0 !important;}
  .rep-table td:first-child,.rep-table th:first-child{position:static !important;}
}
.monthbtn{display:inline-flex;align-items:center;gap:8px;background:var(--ink-800);border:1px solid var(--ink-700);border-radius:10px;padding:8px 11px;color:var(--parchment);font-size:13.5px;font-weight:600;}
.monthbtn .svgi{width:17px;height:17px;color:var(--gold-400);}
.monthbtn .svgi.chev{width:14px;height:14px;color:var(--muted);transition:transform .15s;}
.monthbtn[aria-expanded="true"] .svgi.chev{transform:rotate(180deg);}
.monthbtn[aria-expanded="true"]{border-color:var(--gold-500);}
.mp-bg{position:fixed;inset:0;z-index:60;}
.mp{background:var(--ink-900);border:1px solid var(--ink-700);border-radius:14px;padding:14px;width:288px;box-shadow:0 12px 32px rgba(0,0,0,.45);position:fixed;}
.mp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mp-year{font-weight:700;font-size:15px;}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.mp-m{position:relative;padding:11px 0;border-radius:9px;border:1px solid transparent;background:var(--ink-850);color:var(--parchment);font-size:13px;font-weight:600;}
.mp-m.sel{background:var(--gold-500);color:var(--on-gold);}
.mp-m.now::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold-400);}
.mp-m.sel.now::after{background:var(--on-gold);}
.mp-foot{margin-top:10px;display:flex;justify-content:center;}
@media(hover:hover){ .monthbtn:hover{border-color:var(--gold-500);} .mp-m:not(.sel):hover{border-color:var(--gold-500);} }
@media(pointer:coarse){ .monthbtn{min-height:44px;} }
@media(max-width:860px){
  .mp-bg{background:rgba(0,0,0,.55);display:flex;align-items:flex-end;}
  .mp{position:static;width:100%;border-radius:18px 18px 0 0;border-bottom:none;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:sheetUp .22s ease-out;}
  .mp-m{padding:15px 0;font-size:14px;}
}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;overscroll-behavior:contain;}
.modal{background:var(--ink-900);border:1px solid var(--ink-700);border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.modal h3{margin:0 0 16px;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.formgrid .full{grid-column:1/-1;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}
.progress-track{background:var(--ink-800);border-radius:999px;height:8px;overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;}
.empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;}
.small-muted{color:var(--muted);font-size:12px;}

/* Hover só onde existe mouse (evita "hover preso" no toque) */
@media(hover:hover){
  .btn-primary:hover{background:var(--gold-400);}
  .btn-outline:hover{border-color:var(--gold-500);}
  .navlink:hover{background:var(--ink-800);color:var(--parchment);}
  tr:hover td{background:var(--ink-850);}
  .iconbtn:hover{color:var(--parchment);border-color:var(--gold-500);}
}
.btn:active,.chip:active,.iconbtn:active,.logoutbtn:active,.navlink:active,#bottomNav a:active{opacity:.75;}

/* Telas de toque: alvos maiores e 16px nos campos (evita zoom automático do iOS) */
@media(pointer:coarse){
  .field input,.field select{font-size:16px;}
  .btn,.chip,.tabs button{min-height:44px;}
  .iconbtn{min-width:40px;min-height:40px;}
  .navlink{padding:12px;}
  .logoutbtn{padding:11px;font-size:13px;}
}

/* Notebook/desktop baixo (ex.: celular deitado) */
@media(max-height:520px) and (min-width:861px){ .brand{padding-bottom:10px;} }

/* Tablet / celular */
@media(max-width:860px){
  :root{--bar-w:11px;}
  #sidebar{display:none;}
  #main{padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(88px + env(safe-area-inset-bottom,0px));}
  .topbar-mobile{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar-mobile .brand{padding:0;}
  #bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--ink-900);border-top:1px solid var(--ink-800);display:flex;z-index:40;padding:6px calc(2px + env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) calc(2px + env(safe-area-inset-left,0px));}
  #bottomNav a{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:10px;}
  #bottomNav a .svgi{width:22px;height:22px;}
  #bottomNav a .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #bottomNav a.active{color:var(--gold-400);}
  .page-title{font-size:21px;}
  .page-sub{margin-bottom:16px;}
  .grid{gap:12px;}
  .card{padding:14px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px;}
  .kpi .kpi-value{font-size:clamp(16px,5vw,22px);}
  .tx-table{display:none;}
  .tx-cards{display:block;}
  .auth-card{padding:26px 20px;}
  #authScreen{padding:16px;}
  .modal-bg{align-items:flex-end;padding:0;}
  .modal{max-width:none;border-radius:18px 18px 0 0;border-bottom:none;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:sheetUp .22s ease-out;}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:min(280px,86vw);background:var(--ink-900);border-right:1px solid var(--ink-800);padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));z-index:46;overflow-y:auto;overscroll-behavior:contain;animation:drawerIn .2s ease-out;}
}
@media(max-width:420px){ .formgrid{grid-template-columns:1fr;} }
@media(max-width:420px){ #bottomNav a{font-size:9.5px;padding:6px 0;} }
@media(max-width:360px){ #bottomNav{padding-left:0;padding-right:0;} #bottomNav a{font-size:9px;padding:6px 0;} }
@media(min-width:861px){ #drawerMenuBtn{display:none;} }
@keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
@keyframes drawerIn{from{transform:translateX(-16px);opacity:0;}to{transform:none;opacity:1;}}
@media(prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
</style>
</head>
<body>

<!-- ================= AUTH ================= -->

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } // data LOCAL (toISOString usava UTC e errava o dia à noite no Brasil)
function fmtMoney(n){ if(PRIV) return 'R$ ••••'; n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function monthName(m){ return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][m-1]; }
function monthFull(m){ return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m-1]; }
function ymKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function isoFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------- Mês em visualização (Dashboard, Transações, Contas, Cartões, Orçamentos) ----------
   NÃO é salvo em lugar nenhum: toda vez que o app abre, VIEW começa nulo = acompanha o mês atual
   do calendário (em 1º de novembro já abre em novembro). Só vira um mês fixo se você usar as setas. */
let VIEW = null;
function nowYM(){ const n=new Date(); return {y:n.getFullYear(), m:n.getMonth()+1}; }
function viewYM(){ return VIEW || nowYM(); }
function viewKey(){ const v=viewYM(); return ymKey(v.y,v.m); }
function shiftMonth(delta){
  const v=viewYM(); let y=v.y, m=v.m+delta;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  const n=nowYM();
  VIEW = (y===n.y && m===n.m) ? null : {y,m};
  render();
}
function resetMonth(){ VIEW=null; render(); }
function monthNavHtml(extra){
  const v=viewYM();
  return `<div class="monthbar"><button class="monthbtn" onclick="openMonthPicker(this)" aria-haspopup="dialog" aria-expanded="false" aria-label="Escolher mês. Mês em exibição: ${monthFull(v.m)} de ${v.y}" title="Escolher mês">${IC.cal}<span class="mlabel">${monthName(v.m)}/${v.y}</span>${IC.chev}</button>${extra||''}</div>`;
}
/* Seletor de mês: menu suspenso no computador, bottom sheet no celular */
let MP = null;
function isDesktopLayout(){ try{ return window.matchMedia('(min-width:861px)').matches; }catch(e){ return true; } }
function setMonth(y,m){
  const n=nowYM();
  VIEW = (y===n.y && m===n.m) ? null : {y,m};
  render();
}
function openMonthPicker(btn){
  closeMonthPicker();
  const r = btn.getBoundingClientRect();
  MP = {year:viewYM().y, rect:{left:r.left, bottom:r.bottom, top:r.top}, btn};
  const root = document.createElement('div'); root.id='monthPopRoot'; document.body.appendChild(root);
  btn.setAttribute('aria-expanded','true');
  if(!isDesktopLayout()) document.body.classList.add('noscroll');
  drawMonthPicker();
  const sel = root.querySelector('.mp-m.sel') || root.querySelector('.mp-m'); if(sel && isDesktopLayout()) sel.focus();
}
function drawMonthPicker(){
  const root = document.getElementById('monthPopRoot'); if(!root||!MP) return;
  const v=viewYM(), n=nowYM();
  root.innerHTML = `<div class="mp-bg" onclick="if(event.target===this)closeMonthPicker()">
    <div class="mp" role="dialog" aria-modal="true" aria-label="Escolher mês">
      <div class="mp-head">
        <button class="iconbtn" onclick="mpYear(-1)" aria-label="Ano anterior" title="Ano anterior">${IC.prev}</button>
        <span class="mp-year">${MP.year}</span>
        <button class="iconbtn" onclick="mpYear(1)" aria-label="Próximo ano" title="Próximo ano">${IC.next}</button>
      </div>
      <div class="mp-grid">
        ${Array.from({length:12},(_,i)=>i+1).map(m=>`<button class="mp-m ${MP.year===v.y&&m===v.m?'sel':''} ${MP.year===n.y&&m===n.m?'now':''}" onclick="mpPick(${MP.year},${m})" aria-label="${monthFull(m)} de ${MP.year}">${monthName(m)}</button>`).join('')}
      </div>
      ${VIEW ? `<div class="mp-foot"><button class="chip" onclick="mpPick(${n.y},${n.m})">Ir para o mês atual</button></div>` : ''}
    </div></div>`;
  if(isDesktopLayout()){
    const pop = root.querySelector('.mp'); const w = pop.offsetWidth || 288, h = pop.offsetHeight || 260;
    let left = Math.min(Math.max(8, MP.rect.left), Math.max(8, window.innerWidth - w - 8));
    let top = MP.rect.bottom + 6; if(top + h > window.innerHeight - 8) top = Math.max(8, MP.rect.top - h - 6);
    pop.style.left = left+'px'; pop.style.top = top+'px';
  }
}
function mpYear(d){ if(!MP) return; MP.year += d; drawMonthPicker(); }
function mpPick(y,m){ closeMonthPicker(); setMonth(y,m); }
function closeMonthPicker(){
  const root = document.getElementById('monthPopRoot'); if(root) root.remove();
  if(MP && MP.btn && MP.btn.isConnected) MP.btn.setAttribute('aria-expanded','false');
  const had = !!MP; MP = null;
  if(had) syncScrollLock(); // devolve o estado correto do bloqueio de rolagem
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && MP){ const b=MP.btn; closeMonthPicker(); try{ b.focus(); }catch(_){} } });
/* Data padrão ao criar algo: hoje (mês atual) ou dia 1 do mês que você está vendo */
function defaultDateForView(){ return VIEW ? ymKey(VIEW.y,VIEW.m)+'-01' : todayISO(); }
/* Saldo da conta no fim do mês em visualização: parte do saldo atual e desfaz o que veio depois.
   No mês atual mostra o saldo atual da conta. */
function balanceInView(acc){
  if(!VIEW) return acc.balance;
  const d=currentData(), end=ymKey(VIEW.y,VIEW.m)+'-31';
  let b=acc.balance;
  d.transactions.forEach(t=>{ if(t.accountId===acc.id && t.date>end) b += (t.type==='income' ? -t.amount : t.amount); });
  d.invoicePayments.forEach(p=>{ if(p.accountId===acc.id && p.paidAt && isoFromDate(new Date(p.paidAt))>end) b += p.amount; });
  (d.transfers||[]).forEach(t=>{ if(t.date>end){ if(t.toId===acc.id) b -= t.amount; if(t.fromId===acc.id) b += t.amount; } });
  return Math.round(b*100)/100;
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function maskCpf(v){ v=onlyDigits(v).slice(0,11); return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function maskPhone(v){ v=onlyDigits(v).slice(0,11); if(v.length<=10) return v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3').replace(/-$/,''); return v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3').replace(/-$/,''); }
function validCpf(cpf){
  cpf = onlyDigits(cpf);
  if(cpf.length!==11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let sum=0; for(let i=0;i<9;i++) sum += parseInt(cpf[i])*(10-i);
  let d1 = (sum*10)%11; if(d1===10) d1=0;
  if(d1!==parseInt(cpf[9])) return false;
  sum=0; for(let i=0;i<10;i++) sum += parseInt(cpf[i])*(11-i);
  let d2 = (sum*10)%11; if(d2===10) d2=0;
  return d2===parseInt(cpf[10]);
}
/* SHA-256 em JS puro: crypto.subtle só existe em HTTPS/localhost; sem isso o login quebraria
   ao abrir o app por http:// (ex.: servidor na rede local) no celular. */
function sha256Js(str){
  const data = new TextEncoder().encode(str);
  const K=[], H=[];
  (function(){ let n=2,c=0; while(c<64){ let p=true; for(let i=2;i*i<=n;i++) if(n%i===0){p=false;break;}
    if(p){ if(c<8) H[c]=Math.floor((Math.sqrt(n)%1)*4294967296)>>>0; K[c]=Math.floor((Math.cbrt(n)%1)*4294967296)>>>0; c++; } n++; } })();
  const l = data.length, bitLen = l*8;
  const padLen = ((l+9+63)>>6)<<6;
  const buf = new Uint8Array(padLen); buf.set(data); buf[l]=0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(padLen-8, Math.floor(bitLen/4294967296)); dv.setUint32(padLen-4, bitLen>>>0);
  const w = new Uint32Array(64);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let off=0; off<padLen; off+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(off+i*4);
    for(let i=16;i<64;i++){
      const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22), maj=(a&b)^(a&c)^(b&c), t2=(S0+maj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
async function sha(str){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256Js(str);
}

/* ---------- Storage layer ---------- */
/* localStorage pode lançar erro (Safari em aba privada, armazenamento bloqueado ou cheio) */
const memStore = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in memStore) ? memStore[k] : null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ memStore[k]=v; return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} delete memStore[k]; }
let storageWarned = false;
function showStorageError(){
  if(storageWarned) return; storageWarned = true;
  alert('Não foi possível salvar os dados neste navegador (modo privado, armazenamento bloqueado ou cheio). Suas alterações podem se perder ao fechar a página.');
}
function loadDb(){
  try{ return JSON.parse(lsGet(LS_KEY)) || {users:[], data:{}}; }
  catch(e){ return {users:[], data:{}}; }
}
function saveDb(db){ if(!lsSet(LS_KEY, JSON.stringify(db))) showStorageError(); }
let DB = loadDb();

/* ---------- Preferências do aparelho: tema claro/escuro e modo privacidade (não vão no backup) ---------- */
const PREFS_KEY = 'controlla_prefs_v1';
function loadPrefs(){ try{ return Object.assign({theme:'dark',privacy:false}, JSON.parse(lsGet(PREFS_KEY)||'{}')); }catch(e){ return {theme:'dark',privacy:false}; } }
let PREFS = loadPrefs();
let PRIV = !!PREFS.privacy;     // modo privacidade: esconde os valores em R$ nas telas
function savePrefs(){ lsSet(PREFS_KEY, JSON.stringify(PREFS)); }
function applyTheme(){
  const light = PREFS.theme==='light';
  document.documentElement.setAttribute('data-theme', light?'light':'dark');
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', light?'#F5F1E8':'#0B1118');
}
function toggleTheme(){ PREFS.theme = PREFS.theme==='light' ? 'dark' : 'light'; savePrefs(); applyTheme(); updatePrefUI(); }
function togglePrivacy(){ PRIV=!PRIV; PREFS.privacy=PRIV; savePrefs(); updatePrefUI(); if(currentUser()) render(); }
function prefButtonsHtml(){
  const light = PREFS.theme==='light';
  const priv = SV(PRIV ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
                       : '<path d="M3 3l18 18"/><path d="M10.6 6.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.7A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>');
  const theme = SV(light ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
                         : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
  return `<button class="iconbtn" data-pref="privacy" onclick="togglePrivacy()" aria-pressed="${PRIV}" aria-label="${PRIV?'Mostrar valores':'Ocultar valores'}" title="${PRIV?'Mostrar valores':'Ocultar valores'}">${priv}</button>`
       + `<button class="iconbtn" data-pref="theme" onclick="toggleTheme()" aria-label="${light?'Tema escuro':'Tema claro'}" title="${light?'Tema escuro':'Tema claro'}">${theme}</button>`;
}
function updatePrefUI(){ ['prefsSide','prefsTop','prefsDrawer'].forEach(id=>{ const e=document.getElementById(id); if(e) e.innerHTML=prefButtonsHtml(); }); }

function defaultCategories(){
  const exp = [["Alimentação","#D8674C"],["Transporte","#E4C77A"],["Moradia","#8FBE9C"],["Lazer","#A855F7"],["Saúde","#3B82F6"],["Educação","#14B8A6"],["Outros","#8A94A6"]];
  const inc = [["Salário","#6FA57F"],["Freelance","#C9A227"],["Investimentos","#3B82F6"],["Outros","#8A94A6"]];
  const cats = [];
  exp.forEach(([name,color])=>cats.push({id:uid(),name,type:'expense',color}));
  inc.forEach(([name,color])=>cats.push({id:uid(),name,type:'income',color}));
  return cats;
}
function newUserData(){
  return { accounts:[], categories:defaultCategories(), transactions:[], cards:[], cardInstallments:[], invoicePayments:[], budgets:[], goals:[], recurring:[], transfers:[] };
}
function currentUser(){
  const id = lsGet(SESSION_KEY);
  return DB.users.find(u=>u.id===id) || null;
}
function currentData(){
  const u = currentUser();
  if(!u) return null;
  if(!DB.data[u.id]) DB.data[u.id] = newUserData();
  if(!Array.isArray(DB.data[u.id].recurring)) DB.data[u.id].recurring = [];
  if(!Array.isArray(DB.data[u.id].transfers)) DB.data[u.id].transfers = [];
  return DB.data[u.id];
}
let PERSIST_N = 0;   // conta as gravações: serve para saber se algo mudou depois de uma exclusão
function persist(){ PERSIST_N++; saveDb(DB); }

/* ---------- Desfazer exclusão: guarda uma cópia dos dados e mostra "Desfazer" por 8 segundos ---------- */
let UNDO = null, UNDO_TIMER = null;
function withUndo(label, fn){
  const u=currentUser(); if(!u) return fn();
  const snap=JSON.stringify(currentData());
  fn();
  showUndo(label, snap, u.id);
}
function showUndo(label, snap, userId){
  hideUndo();
  UNDO={snap, userId, n:PERSIST_N};
  const el=document.createElement('div'); el.id='undoToast'; el.setAttribute('role','status');
  el.innerHTML=`<span>${escapeHtml(label)}</span><button onclick="undoDelete()">Desfazer</button><button class="x" aria-label="Fechar" onclick="hideUndo()">×</button>`;
  document.body.appendChild(el);
  UNDO_TIMER=setTimeout(hideUndo, 8000);
}
function hideUndo(){ clearTimeout(UNDO_TIMER); UNDO=null; const e=document.getElementById('undoToast'); if(e) e.remove(); }
function undoDelete(){
  if(!UNDO) return;
  const u=currentUser(), U=UNDO;
  if(!u || u.id!==U.userId) return hideUndo();
  if(PERSIST_N!==U.n){ hideUndo(); return alert('Você fez outras alterações depois da exclusão, então não dá para desfazer sem perdê-las.'); }
  DB.data[U.userId]=JSON.parse(U.snap);
  hideUndo(); persist(); render();
}

/* ---------- Auth ---------- */
let regTab = 'email';
function setRegTab(t){
  regTab = t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+t[0].toUpperCase()+t.slice(1)).classList.add('active');
  const labels = {email:'E-mail', cpf:'CPF', phone:'Telefone'};
  document.getElementById('regIdLabel').textContent = labels[t];
  const inp = document.getElementById('regId');
  inp.value=''; inp.placeholder = t==='email' ? 'voce@email.com' : (t==='cpf' ? '000.000.000-00' : '(00) 00000-0000');
  inp.inputMode = t==='email' ? 'email' : (t==='cpf' ? 'numeric' : 'tel');
  inp.autocomplete = t==='email' ? 'email' : (t==='phone' ? 'tel' : 'off');
}
function maskRegId(){
  const inp = document.getElementById('regId');
  if(regTab==='cpf') inp.value = maskCpf(inp.value);
  else if(regTab==='phone') inp.value = maskPhone(inp.value);
}
function showRegister(){ document.getElementById('loginView').classList.add('hidden'); document.getElementById('registerView').classList.remove('hidden'); document.getElementById('authTitle').textContent='Criar conta'; document.getElementById('authSub').textContent='Leva menos de um minuto'; setAuthErr(''); }
function showLogin(){ document.getElementById('registerView').classList.add('hidden'); document.getElementById('loginView').classList.remove('hidden'); document.getElementById('authTitle').textContent='Entrar'; document.getElementById('authSub').textContent='Seu controle financeiro pessoal'; setAuthErr(''); }
function setAuthErr(msg){ document.getElementById('authError').innerHTML = msg ? `<div class="err">${escapeHtml(msg)}</div>` : ''; }

async function doRegister(){
  const name = document.getElementById('regName').value.trim();
  let idVal = document.getElementById('regId').value.trim();
  const pass = document.getElementById('regPass').value;
  if(!name) return setAuthErr('Informe seu nome.');
  if(!idVal) return setAuthErr('Informe ' + (regTab==='email'?'seu e-mail.':regTab==='cpf'?'seu CPF.':'seu telefone.'));
  if(pass.length<6) return setAuthErr('A senha precisa ter ao menos 6 caracteres.');

  const user = {id:uid(), name, email:null, cpf:null, phone:null};
  if(regTab==='email'){
    if(!/^\S+@\S+\.\S+$/.test(idVal)) return setAuthErr('E-mail inválido.');
    user.email = idVal.toLowerCase();
    if(DB.users.some(u=>u.email===user.email)) return setAuthErr('Já existe uma conta com esse e-mail.');
  } else if(regTab==='cpf'){
    if(!validCpf(idVal)) return setAuthErr('CPF inválido.');
    user.cpf = onlyDigits(idVal);
    if(DB.users.some(u=>u.cpf===user.cpf)) return setAuthErr('Já existe uma conta com esse CPF.');
  } else {
    const digits = onlyDigits(idVal);
    if(digits.length<10) return setAuthErr('Telefone inválido.');
    user.phone = digits;
    if(DB.users.some(u=>u.phone===user.phone)) return setAuthErr('Já existe uma conta com esse telefone.');
  }
  user.passwordHash = await sha(pass);
  DB.users.push(user);
  DB.data[user.id] = newUserData();
  persist();
  lsSet(SESSION_KEY, user.id);
  enterApp();
}

async function doLogin(){
  const idVal = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!idVal || !pass) return setAuthErr('Preencha login e senha.');
  const digits = onlyDigits(idVal);
  const emailLc = idVal.toLowerCase();
  const user = DB.users.find(u => u.email===emailLc || (digits && (u.cpf===digits || u.phone===digits)));
  if(!user) return setAuthErr('Conta não encontrada.');
  const hash = await sha(pass);
  if(hash !== user.passwordHash) return setAuthErr('Senha incorreta.');
  lsSet(SESSION_KEY, user.id);
  enterApp();
}
function logout(){ hideUndo(); lsDel(SESSION_KEY); closeDrawer(); closeModal(); document.getElementById('loginPass').value=''; document.getElementById('regPass').value=''; location.hash='#/dashboard'; document.getElementById('appShell').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); showLogin(); }

/* ---------- App shell / router ---------- */
function enterApp(){
  VIEW = null; // ao entrar, sempre começa no mês atual
  hideUndo(); applyTheme(); updatePrefUI();
  TXF = txfFresh();
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  const u = currentUser();
  document.getElementById('sideUserName').textContent = u.name;
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} // pede ao navegador para não apagar os dados
  buildNav();
  if(!location.hash || location.hash==='#/login' || location.hash==='#/register') location.hash = '#/dashboard';
  render();
}
function buildNav(){
  const side = document.getElementById('navLinks');
  const bottom = document.getElementById('bottomNav');
  side.innerHTML = NAV.map(n=>`<a href="#/${n.id}" class="navlink" data-nav="${n.id}"><span class="ic">${icon(n.id)}</span>${n.label}</a>`).join('');
  bottom.innerHTML = NAV.filter(n=>n.bottom!==false).map(n=>`<a href="#/${n.id}" data-nav="${n.id}">${icon(n.id)}<span class="lbl">${n.short}</span></a>`).join('')
    + `<a href="#" id="navMore" onclick="openDrawer();return false" aria-label="Mais opções">${icon('more')}<span class="lbl">Mais</span></a>`;
}

function closeDrawer(){ document.getElementById('drawerRoot').innerHTML=''; syncScrollLock(); }

let lastRoute = null;
window.addEventListener('hashchange', render);
let RENDERED_NOW = null;
/* Se o app ficou aberto na virada do mês (e você não escolheu outro mês), atualiza sozinho ao voltar para ele */
function checkMonthRollover(){
  if(!currentUser()) return;
  const n=nowYM();
  if(!VIEW && RENDERED_NOW && RENDERED_NOW!==ymKey(n.y,n.m)) return render();
  if(processRecurring()) render();   // virou o dia com o app aberto: lança o que venceu
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkMonthRollover(); });
window.addEventListener('focus', checkMonthRollover);
function render(){
  const u = currentUser();
  if(!u){ document.getElementById('appShell').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); return; }
  RENDERED_NOW = ymKey(nowYM().y, nowYM().m);
  processRecurring();   // lança as cobranças recorrentes que já venceram
  closeMonthPicker();
  const route = (location.hash || '#/dashboard').replace('#/','');
  if(route!==lastRoute){ lastRoute=route; window.scrollTo(0,0); } // ao trocar de aba, volta ao topo
  document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active', el.dataset.nav===route));
  const moreEl=document.getElementById('navMore'); if(moreEl) moreEl.classList.toggle('active', !NAV.some(n=>n.bottom!==false && n.id===route));
  const el = document.getElementById('pageContent');
  const pages = {dashboard:renderDashboard, transactions:renderTransactions, accounts:renderAccounts, cards:renderCards, recurring:renderRecurring, reports:renderReports, budgets:renderBudgets, categories:renderCategories};
  (pages[route] || renderDashboard)(el);
}
function syncScrollLock(){
  const open = !!(document.getElementById('modalRoot').innerHTML || document.getElementById('drawerRoot').innerHTML);
  document.body.classList.toggle('noscroll', open);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; syncScrollLock(); }
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  syncScrollLock();
  // No computador (mouse), já foca o primeiro campo; em telas de toque não, para não abrir o teclado sozinho
  try{ if(!window.matchMedia('(pointer:coarse)').matches){ const f=document.querySelector('#modalRoot .modal input:not([type=color]):not([type=date]), #modalRoot .modal select'); if(f) f.focus(); } }catch(e){}
}

/* ============================================================
   DASHBOARD
   ============================================================ */
/* Compras no cartão do mês: contam como despesa no mês da FATURA (pagar a fatura não conta de novo) */
function cardInstOf(d,y,m){ return d.cardInstallments.filter(i=>i.invoiceYear===y && i.invoiceMonth===m); }
function budgetSpent(d,b,year,month){
  const key=ymKey(year,month), byName=id=>{ const c=d.categories.find(c=>c.id===id); return c && c.name===b.category; };
  const tx=d.transactions.filter(t=>t.type==='expense' && t.date.startsWith(key) && byName(t.categoryId)).reduce((s,t)=>s+t.amount,0);
  const cd=cardInstOf(d,year,month).filter(i=>byName(i.categoryId)).reduce((s,i)=>s+i.amount,0);
  return tx+cd;
}
function renderDashboard(el){
  const d = currentData();
  const v = viewYM(); const ym = viewKey();
  const totalBalance = d.accounts.reduce((s,a)=>s+balanceInView(a),0);
  const txThisMonth = d.transactions.filter(t=>t.date.startsWith(ym));
  const income = txThisMonth.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const cardInst = cardInstOf(d, v.y, v.m);
  const cardExpense = cardInst.reduce((s,i)=>s+i.amount,0);
  const expense = txThisMonth.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0) + cardExpense;
  const saved = income - expense;

  // 6-month evolution
  const months = [];
  for(let i=5;i>=0;i--){ const dt=new Date(v.y, v.m-1-i, 1); months.push({y:dt.getFullYear(), m:dt.getMonth()+1, label:monthName(dt.getMonth()+1)}); }
  const evo = months.map(mo=>{
    const key = mo.y+'-'+String(mo.m).padStart(2,'0');
    const txs = d.transactions.filter(t=>t.date.startsWith(key));
    return {label:mo.label, income:txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0), expense:txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0) + cardInstOf(d,mo.y,mo.m).reduce((s,i)=>s+i.amount,0)};
  });
  const maxEvo = Math.max(1, ...evo.flatMap(e=>[e.income,e.expense]));

  // category breakdown (expenses this month)
  const byCat = {};
  txThisMonth.filter(t=>t.type==='expense').forEach(t=>{
    const cat = d.categories.find(c=>c.id===t.categoryId);
    const key = cat ? cat.name : 'Outros';
    const color = cat ? cat.color : '#8A94A6';
    byCat[key] = byCat[key] || {value:0,color}; byCat[key].value += t.amount;
  });
  cardInst.forEach(i=>{
    const cat = d.categories.find(c=>c.id===i.categoryId);
    const key = cat ? cat.name : 'Outros';
    const color = cat ? cat.color : '#8A94A6';
    byCat[key] = byCat[key] || {value:0,color}; byCat[key].value += i.amount;
  });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1].value-a[1].value);
  const totalCat = catEntries.reduce((s,[,v])=>s+v.value,0) || 1;

  el.innerHTML = `
    <h1 class="page-title">Olá, ${escapeHtml(currentUser().name.split(' ')[0])}</h1>
    <p class="page-sub">Resumo de ${monthFull(v.m)} de ${v.y}</p>
    ${monthNavHtml()}
    ${backupReminderHtml()}
    ${remindersHtml()}
    <div class="grid kpis">
      <div class="card kpi"><div class="kpi-label">${VIEW ? 'Saldo no fim do mês' : 'Saldo total'}</div><div class="kpi-value">${fmtMoney(totalBalance)}</div></div>
      <div class="card kpi"><div class="kpi-label">Receitas no mês</div><div class="kpi-value">${fmtMoney(income)}</div></div>
      <div class="card kpi"><div class="kpi-label">Despesas no mês</div><div class="kpi-value">${fmtMoney(expense)}</div>${cardExpense>0?`<div class="kpi-delta small-muted">Inclui ${fmtMoney(cardExpense)} no cartão</div>`:''}</div>
      <div class="card kpi"><div class="kpi-label">Economia no mês</div><div class="kpi-value ${saved>=0?'up':'down'}">${fmtMoney(saved)}</div></div>
    </div>
    <div class="grid two-col">
      <div class="card">
        <p class="section-title" style="margin-bottom:16px">Evolução (6 meses)</p>
        <div style="display:flex;align-items:flex-end;gap:14px;height:170px;">
          ${evo.map(e=>`
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;">
              <div style="display:flex;gap:3px;align-items:flex-end;height:140px;">
                <div title="Receitas ${fmtMoney(e.income)}" style="width:var(--bar-w,14px);border-radius:3px 3px 0 0;background:var(--sage-500);height:${Math.max(3,e.income/maxEvo*140)}px;"></div>
                <div title="Despesas ${fmtMoney(e.expense)}" style="width:var(--bar-w,14px);border-radius:3px 3px 0 0;background:var(--coral-500);height:${Math.max(3,e.expense/maxEvo*140)}px;"></div>
              </div>
              <span class="small-muted">${e.label}</span>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)"><span><span class="dot" style="background:var(--sage-500)"></span>Receitas</span><span><span class="dot" style="background:var(--coral-500)"></span>Despesas</span></div>
      </div>

/* ============================================================
   TRANSACTIONS
   ============================================================ */
function txfFresh(){ return {q:'',type:'',cat:'',acc:'',min:'',max:'',all:false,open:false}; }
let TXF = txfFresh();
function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function accNameById(id){ const a=currentData().accounts.find(x=>x.id===id); return a?a.name:'(conta excluída)'; }
function txFilterCount(){ return (TXF.type?1:0)+(TXF.cat?1:0)+(TXF.acc?1:0)+(TXF.min!==''?1:0)+(TXF.max!==''?1:0)+(TXF.all?1:0); }
function txHasFilter(){ return !!TXF.q.trim() || txFilterCount()>0; }
/* Lançamentos (transações + transferências) que passam pelos filtros */
function txItems(){
  const d=currentData(), key=viewKey(), q=norm(TXF.q.trim());
  const inScope = date => TXF.all || date.startsWith(key);
  const min=parseFloat(TXF.min), max=parseFloat(TXF.max);
  const amountOk = a => !( !isNaN(min) && a<min ) && !( !isNaN(max) && a>max );
  const out=[];
  d.transactions.forEach(t=>{
    if(!inScope(t.date)) return;
    if(TXF.type && TXF.type!==t.type) return;
    if(TXF.cat && TXF.cat!==t.categoryId) return;
    if(TXF.acc && TXF.acc!==t.accountId) return;
    if(!amountOk(t.amount)) return;
    if(q){ const cat=d.categories.find(c=>c.id===t.categoryId);
      if(!(norm(t.description).includes(q) || norm(t.notes).includes(q) || norm(cat&&cat.name).includes(q))) return; }
    out.push({kind:'tx', date:t.date, t});
  });
  (d.transfers||[]).forEach(tr=>{
    if(!inScope(tr.date)) return;
    if(TXF.type && TXF.type!=='transfer') return;
    if(TXF.cat) return;
    if(TXF.acc && TXF.acc!==tr.fromId && TXF.acc!==tr.toId) return;
    if(!amountOk(tr.amount)) return;
    if(q && !(norm(tr.description).includes(q) || norm(accNameById(tr.fromId)).includes(q) || norm(accNameById(tr.toId)).includes(q))) return;
    out.push({kind:'transfer', date:tr.date, tr});
  });
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

  const scope=TXF.all ? 'todos os meses' : monthFull(viewYM().m).toLowerCase()+' de '+viewYM().y;
  const summary=`<div class="small-muted" style="margin-bottom:10px">${items.length} lançamento(s) · ${scope}${txs.length?` · Receitas <b class="up">${fmtMoney(inc)}</b> · Despesas <b class="down">${fmtMoney(exp)}</b>`:''}</div>`;
  const emptyMsg = txHasFilter() ? 'Nenhum lançamento encontrado com esses filtros' : 'Nenhuma transação neste mês';
  const txActions = t=>`<button class="iconbtn" aria-label="Editar" title="Editar" onclick="openTxModal('${t.id}')">${IC.edit}</button> <button class="iconbtn" aria-label="Excluir" title="Excluir" onclick="deleteTx('${t.id}')">${IC.del}</button>`;
  const trActions = t=>`<button class="iconbtn" aria-label="Editar" title="Editar" onclick="openTransferModal('${t.id}')">${IC.edit}</button> <button class="iconbtn" aria-label="Excluir" title="Excluir" onclick="deleteTransfer('${t.id}')">${IC.del}</button>`;
  const route = tr=>`${escapeHtml(accNameById(tr.fromId))} → ${escapeHtml(accNameById(tr.toId))}`;
  const trows = items.map(it=>{
    if(it.kind==='transfer'){ const tr=it.tr; return `<tr>

          <td><span class="pill pill-transfer">Transferência</span></td>
          <td style="font-weight:600;white-space:nowrap">${fmtMoney(tr.amount)}</td>

    const t=it.t, cat=d.categories.find(c=>c.id===t.categoryId), acc=d.accounts.find(a=>a.id===t.accountId);

          <td style="white-space:nowrap">${txActions(t)}</td></tr>`; }).join('');
  const tcards = items.map(it=>{
    if(it.kind==='transfer'){ const tr=it.tr; return `
          <div class="tx-card"><div class="tx-main"><div class="tx-desc">${escapeHtml(tr.description||'Transferência')}</div>
            <div class="tx-meta">${fmtDate(tr.date)} · ${route(tr)}</div></div>

    const t=it.t, cat=d.categories.find(c=>c.id===t.categoryId), acc=d.accounts.find(a=>a.id===t.accountId);
    return `
          <div class="tx-card">
            <div class="tx-main">
              <div class="tx-desc">${escapeHtml(t.description)}</div>
              <div class="tx-meta">${fmtDate(t.date)}${cat?` · <span class="dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}`:''}${acc?` · ${escapeHtml(acc.name)}`:''}</div>
            </div>
            <div class="tx-side">
              <div class="tx-amount ${t.type==='income'?'up':'down'}">${t.type==='income'?'+':'-'} ${fmtMoney(t.amount)}</div>
              <div class="tx-actions">${txActions(t)}</div>
            </div>
          </div>`; }).join('');
  return `${summary}
      <div class="tx-table">
        <table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Conta</th><th>Tipo</th><th>Valor</th><th></th></tr></thead>

      </div>

/* ---- Transferências entre contas (mexem nos saldos, mas não contam como receita nem despesa) ---- */
function openTransferModal(id){
  const d=currentData();
  if(!id && d.accounts.length<2) return alert('Cadastre pelo menos duas contas para fazer uma transferência.');
  const t = id ? d.transfers.find(x=>x.id===id) : {fromId:d.accounts[0].id, toId:d.accounts[1].id, amount:'', date:defaultDateForView(), description:''};
  if(!t) return;
  const opts = sel => d.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${escapeHtml(a.name)}</option>`).join('');
  openModal(`
    <h3>${id?'Editar transferência':'Nova transferência'}</h3>
    <div class="formgrid">
      <div class="field"><label>De</label><select id="tfFrom">${opts(t.fromId)}</select></div>
      <div class="field"><label>Para</label><select id="tfTo">${opts(t.toId)}</select></div>
      <div class="field"><label>Valor</label><input id="tfAmount" type="number" inputmode="decimal" step="0.01" value="${t.amount}"></div>
      <div class="field"><label>Data</label><input id="tfDate" type="date" value="${t.date}"></div>
      <div class="field full"><label>Descrição (opcional)</label><input id="tfDesc" value="${escapeHtml(t.description||'')}" placeholder="Transferência"></div>
    </div>
    <p class="small-muted" style="margin:8px 0 0">Não conta como receita nem despesa: só move o dinheiro entre as contas.</p>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveTransfer('${id||''}')">Salvar</button></div>`);
}
function saveTransfer(id){
  const d=currentData();
  const fromId=document.getElementById('tfFrom').value, toId=document.getElementById('tfTo').value;
  if(!fromId||!toId) return alert('Escolha as duas contas.');
  if(fromId===toId) return alert('Escolha contas diferentes para a origem e o destino.');
  const amount=parseFloat(document.getElementById('tfAmount').value); if(!amount||amount<=0) return alert('Informe um valor válido.');
  const date=document.getElementById('tfDate').value||todayISO();
  const description=document.getElementById('tfDesc').value.trim()||'Transferência';
  if(id){
    const old=d.transfers.find(x=>x.id===id); if(!old) return closeModal();
    adjustBalance(old.fromId, old.amount); adjustBalance(old.toId, -old.amount);
    Object.assign(old,{fromId,toId,amount,date,description});
  } else {
    d.transfers.push({id:uid(),fromId,toId,amount,date,description});
  }
  adjustBalance(fromId, -amount); adjustBalance(toId, amount);
  persist(); closeModal(); render();
}
function deleteTransfer(id){
  if(!confirm('Excluir esta transferência? Os saldos das duas contas voltam ao que eram antes.')) return;
  withUndo('Transferência excluída', ()=>{
    const d=currentData(); const t=d.transfers.find(x=>x.id===id); if(!t) return;
    adjustBalance(t.fromId, t.amount); adjustBalance(t.toId, -t.amount);
    d.transfers=d.transfers.filter(x=>x.id!==id);
    persist(); render();
  });
}
function openTxModal(id){
  const d = currentData();
  const t = id ? d.transactions.find(x=>x.id===id) : {description:'',amount:'',type:'expense',date:defaultDateForView(),accountId:d.accounts[0]?.id||'',categoryId:'',notes:''};
  const cats = d.categories.filter(c=>c.type===t.type);
  openModal(`
    <h3>${id?'Editar transação':'Nova transação'}</h3>
    <div class="formgrid">
      <div class="field full"><label>Descrição</label><input id="txDesc" value="${escapeHtml(t.description)}"></div>
      <div class="field"><label>Tipo</label><select id="txType" onchange="refreshTxCats()"><option value="expense" ${t.type==='expense'?'selected':''}>Despesa</option><option value="income" ${t.type==='income'?'selected':''}>Receita</option></select></div>
      <div class="field"><label>Valor</label><input id="txAmount" type="number" inputmode="decimal" step="0.01" value="${t.amount}"></div>
      <div class="field"><label>Data</label><input id="txDate" type="date" value="${t.date}"></div>
      <div class="field"><label>Conta</label><select id="txAccount">${d.accounts.map(a=>`<option value="${a.id}" ${t.accountId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join('') || '<option value="">Nenhuma conta</option>'}</select></div>
      <div class="field full"><label>Categoria</label><select id="txCategory">${cats.map(c=>`<option value="${c.id}" ${t.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveTx('${id||''}')">Salvar</button></div>`);

function refreshTxCats(){
  const d = currentData(); const type = document.getElementById('txType').value;
  const cats = d.categories.filter(c=>c.type===type);
  document.getElementById('txCategory').innerHTML = cats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}
function saveTx(id){
  const d = currentData();
  const description = document.getElementById('txDesc').value.trim(); if(!description) return;
  const type = document.getElementById('txType').value;
  const amount = parseFloat(document.getElementById('txAmount').value); if(!amount || amount<=0) return alert('Informe um valor válido.');
  const date = document.getElementById('txDate').value || todayISO();
  const accountId = document.getElementById('txAccount').value;
  const categoryId = document.getElementById('txCategory').value;
  if(!accountId) return alert('Cadastre uma conta primeiro.');

  if(id){
    const old = d.transactions.find(x=>x.id===id);
    adjustBalance(old.accountId, old.type==='income' ? -old.amount : old.amount);
    Object.assign(old, {description,type,amount,date,accountId,categoryId});
    adjustBalance(accountId, type==='income' ? amount : -amount);
  } else {
    d.transactions.push({id:uid(),description,type,amount,date,accountId,categoryId,notes:''});

  }
  persist(); closeModal(); render();
}

function deleteTx(id){

  withUndo('Transação excluída', ()=>{
    const d = currentData(); const t = d.transactions.find(x=>x.id===id);
    adjustBalance(t.accountId, t.type==='income' ? -t.amount : t.amount);
    d.transactions = d.transactions.filter(x=>x.id!==id);
    persist(); render();
  });
}

/* ---- itens da fatura: gerar, editar e excluir ---- */
function buildInstallments(card, purchaseId, description, amount, totalInstallments, date, categoryId){
  const per = Math.round((amount/totalInstallments)*100)/100;
  const dt = new Date(date+'T00:00:00');
  let m = dt.getMonth()+1, y = dt.getFullYear();
  if(dt.getDate() > card.closingDay){ m++; if(m>12){m=1;y++;} }
  const out = [];
  for(let n=1;n<=totalInstallments;n++){
    out.push({id:uid(),cardId:card.id,categoryId,purchaseId,description,amount:per,installmentNumber:n,totalInstallments,invoiceMonth:m,invoiceYear:y,purchaseDate:date,totalAmount:amount});
    m++; if(m>12){m=1;y++;}
  }
  return out;
}
function isInvoicePaid(cardId,m,y){ return currentData().invoicePayments.some(p=>p.cardId===cardId && p.invoiceMonth===m && p.invoiceYear===y); }
function purchaseParts(i){ return currentData().cardInstallments.filter(x=>x.purchaseId===i.purchaseId).sort((a,b)=>a.installmentNumber-b.installmentNumber); }
function purchaseInfo(parts){
  const f = parts[0];
  const total = f.totalAmount!=null ? f.totalAmount : Math.round(f.amount*f.totalInstallments*100)/100;
  // compras antigas não guardavam a data: usa o dia 1 do mês da 1ª parcela (cai na mesma fatura)
  const date = f.purchaseDate || isoFromDate(new Date(f.invoiceYear, f.invoiceMonth-1-(f.installmentNumber-1), 1));
  const locked = parts.some(x=>isInvoicePaid(x.cardId,x.invoiceMonth,x.invoiceYear));
  return {total, date, locked};
}

/* ============================================================
   BUDGETS & GOALS
   ============================================================ */
/* ============================================================
   RECORRENTES (assinaturas, internet, aluguel, seguros...)
   Cada cobrança é lançada sozinha na data certa: como transação
   (se sair de uma conta) ou como compra na fatura (se for no cartão).
   ============================================================ */
const FREQ = {monthly:'Mensal', yearly:'Anual'};
function pad2(n){ return String(n).padStart(2,'0'); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
/* Datas (AAAA-MM-DD) em que a cobrança acontece, da 1ª até `untilISO` (ou até a data de término) */
function recOccurrences(r, untilISO){
  const out=[]; if(!r.startDate) return out;
  const [sy,sm,sd] = r.startDate.split('-').map(Number);
  const end = (r.endDate && r.endDate < untilISO) ? r.endDate : untilISO;
  if(r.frequency==='yearly'){
    for(let y=sy; out.length<200; y++){
      const iso = y+'-'+pad2(sm)+'-'+pad2(Math.min(sd,daysInMonth(y,sm)));
      if(iso>end) break; out.push(iso);
    }
  } else {
    let y=sy, m=sm;
    while(out.length<1500){
      const iso = y+'-'+pad2(m)+'-'+pad2(Math.min(sd,daysInMonth(y,m)));
      if(iso>end) break; out.push(iso);
      m++; if(m>12){ m=1; y++; }
    }
  }
  return out;
}
function recSourceOk(r){
  const d=currentData();
  return r.sourceType==='card' ? d.cards.some(c=>c.id===r.sourceId) : d.accounts.some(a=>a.id===r.sourceId);
}
function launchRecurring(r, date){
  const d=currentData();
  if(!recSourceOk(r)) return false;
  if(r.sourceType==='card'){
    const card=d.cards.find(c=>c.id===r.sourceId);
    const parts=buildInstallments(card, uid(), r.name, r.amount, 1, date, r.categoryId);
    parts.forEach(x=>{ x.recurringId=r.id; });
    d.cardInstallments.push(...parts);
  } else {
    const income = r.kind==='income';
    d.transactions.push({id:uid(),description:r.name,type:income?'income':'expense',amount:r.amount,date,accountId:r.sourceId,categoryId:r.categoryId,notes:'Recorrente',recurringId:r.id});
    adjustBalance(r.sourceId, income ? r.amount : -r.amount);
  }
  return true;
}
/* Lança tudo o que venceu até hoje e ainda não foi lançado. Devolve quantos lançamentos fez. */
function processRecurring(){
  const d=currentData(); if(!d || !d.recurring || !d.recurring.length) return 0;
  const today=todayISO(); let n=0;
  d.recurring.forEach(r=>{
    if(r.paused) return;
    if(!Array.isArray(r.launched)) r.launched=[];
    const done=new Set(r.launched);
    recOccurrences(r,today).forEach(date=>{
      if(done.has(date)) return;
      if(launchRecurring(r,date)){ r.launched.push(date); n++; }
    });
  });
  if(n) persist();
  return n;
}
/* Marca como "já tratadas" as datas até hoje (sem lançar nada): usado ao pausar/retomar e ao mudar a agenda */
function skipRecurringUpToToday(r){
  const done=new Set(r.launched||[]);
  recOccurrences(r,todayISO()).forEach(x=>done.add(x));
  r.launched=[...done];
}
function plusDaysISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); return isoFromDate(new Date(y,m-1,d+n)); }
function recNext(r){
  const today=todayISO();
  return recOccurrences(r, plusDaysISO(today,800)).find(x=>x>today) || null;
}
function daysUntil(iso){
  const [y,m,d]=iso.split('-').map(Number), [ty,tm,td]=todayISO().split('-').map(Number);
  return Math.round((new Date(y,m-1,d)-new Date(ty,tm-1,td))/86400000);
}
function recMonthly(r){ return r.frequency==='yearly' ? r.amount/12 : r.amount; }
function recStatus(r){
  if(r.paused) return {label:'Pausada', cls:''};
  if(!recSourceOk(r)) return {label:r.sourceType==='card'?'Cartão removido':'Conta removida', cls:'warn'};
  if(!recNext(r)) return {label:'Encerrada', cls:''};
  return {label:'Ativa', cls:'gold'};
}

/* ---- Lembretes de vencimento (Dashboard) ---- */
/* Data de vencimento da fatura (m,y): se o vencimento é depois do fechamento, é no mesmo mês; senão, no mês seguinte */
function invoiceDueDate(card,m,y){
  let dm=m, dy=y;
  if(card.dueDay<=card.closingDay){ dm++; if(dm>12){ dm=1; dy++; } }
  return dy+'-'+pad2(dm)+'-'+pad2(Math.min(card.dueDay, daysInMonth(dy,dm)));
}
/* Faturas em aberto que vencem em até `days` dias (ou venceram há no máximo 30) + recorrentes que caem nesse prazo */
function getReminders(days){
  const d=currentData(), today=todayISO(), horizon=plusDaysISO(today, days||7), oldest=plusDaysISO(today,-30);
  const n=nowYM(), out=[];
  d.cards.forEach(c=>{
    for(let k=-2;k<=2;k++){
      const dt=new Date(n.y,n.m-1+k,1), m=dt.getMonth()+1, y=dt.getFullYear();
      const total=d.cardInstallments.filter(i=>i.cardId===c.id && i.invoiceMonth===m && i.invoiceYear===y).reduce((s,i)=>s+i.amount,0);
      if(total<=0 || isInvoicePaid(c.id,m,y)) continue;
      const due=invoiceDueDate(c,m,y);
      if(due>=oldest && due<=horizon) out.push({kind:'invoice',date:due,title:'Fatura '+c.name,sub:'Fatura '+monthName(m)+'/'+y,amount:total,cardId:c.id,m,y});
    }
  });
  d.recurring.forEach(r=>{
    if(r.paused || !recSourceOk(r)) return;
    const nx=recNext(r);
    if(nx && nx<=horizon) out.push({kind:r.kind==='income'?'income':'bill',date:nx,title:r.name,sub:r.kind==='income'?'Entrada prevista':'Cobrança recorrente',amount:r.amount,recId:r.id});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date) || a.title.localeCompare(b.title));
}
function remindersHtml(){
  if(VIEW) return '';          // só no mês atual: lembrete é sobre "agora"
  const list=getReminders(7); if(!list.length) return '';
  const when = dt => { const n=daysUntil(dt);
    if(n<0) return {t:'Atrasada há '+(-n)+(n===-1?' dia':' dias'), late:true};
    if(n===0) return {t:'Hoje'}; if(n===1) return {t:'Amanhã'}; return {t:'em '+n+' dias'}; };

        <span class="dot" style="background:${color(it.kind)}"></span>
        <span style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">${escapeHtml(it.title)}</b><span class="small-muted" style="display:block">${escapeHtml(it.sub)}</span></span>
        <span style="text-align:right;white-space:nowrap"><b class="${it.kind==='income'?'up':''}">${it.kind==='income'?'+ ':''}${fmtMoney(it.amount)}</b><span class="small-muted ${w.late?'down':''}" style="display:block">${w.t} · ${fmtDate(it.date)}</span></span>
      </button>`; }).join('')}
    ${more>0?`<div class="small-muted" style="padding-top:8px">+ ${more} outro(s)</div>`:''}
  </div>`;
}
function goReminder(kind,m,y){

  if(!id && d.accounts.length===0 && d.cards.length===0) return alert('Cadastre uma conta ou um cartão primeiro.');

    <h3>${id?'Editar recorrente':'Nova recorrente'}</h3>

      <div class="field"><label>Valor</label><input id="rAmount" type="number" inputmode="decimal" step="0.01" value="${v.amount}"></div>
      <div class="field"><label>Repete</label><select id="rFreq"><option value="monthly" ${v.frequency==='monthly'?'selected':''}>Todo mês</option><option value="yearly" ${v.frequency==='yearly'?'selected':''}>Todo ano</option></select></div>
      <div class="field"><label>${id?'Data base (dia da cobrança)':'1ª data'}</label><input id="rStart" type="date" value="${v.startDate}"></div>
      <div class="field"><label>Termina em (opcional)</label><input id="rEnd" type="date" value="${v.endDate||''}"></div>
      <div class="field"><label id="rSrcTypeLabel">Sai de</label><select id="rSrcType" onchange="recFillSources()"><option value="account" ${v.sourceType==='account'?'selected':''}>Conta</option><option value="card" ${v.sourceType==='card'?'selected':''}>Cartão de crédito</option></select></div>
      <div class="field"><label id="rSrcLabel">Conta</label><select id="rSrc"></select></div>
      <div class="field full"><label>Categoria</label><select id="rCat"></select></div>
    </div>
    ${id ? '' : `<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:4px"><input id="rPast" type="checkbox" style="width:auto"> Lançar também as datas anteriores a hoje</label>`}
    <p class="small-muted" style="margin:8px 0 0">${id ? 'Mudanças no valor, nome e categoria valem para os próximos lançamentos; os já feitos não mudam. Mudar a data vale a partir do próximo lançamento.' : 'O lançamento é feito sozinho na data: como transação (conta) ou compra na fatura (cartão).'}</p>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveRecurring('${id||''}')">Salvar</button></div>`);
  window._recSrcInit = v.sourceId; window._recCatInit = v.categoryId;
  recKindChanged();
}
function recKindChanged(){
  const income = document.getElementById('rKind').value==='income';
  const st = document.getElementById('rSrcType');
  const cardOpt = st.querySelector('option[value="card"]');
  if(income){ st.value='account'; cardOpt.disabled=true; } else { cardOpt.disabled=false; }
  document.getElementById('rSrcTypeLabel').textContent = income ? 'Entra em' : 'Sai de';
  recFillSources(); recFillCats();
}
function recFillCats(){
  const d=currentData(); const kind=document.getElementById('rKind').value;
  const sel=document.getElementById('rCat'); const keep=sel.value||window._recCatInit;
  const cats=d.categories.filter(c=>c.type===kind);
  sel.innerHTML = cats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if(cats.some(c=>c.id===keep)) sel.value=keep;
}
function recFillSources(){
  const d=currentData(); const type=document.getElementById('rSrcType').value;
  const list = type==='card' ? d.cards : d.accounts;
  const sel=document.getElementById('rSrc');
  document.getElementById('rSrcLabel').textContent = type==='card' ? 'Cartão' : 'Conta';
  sel.innerHTML = list.length ? list.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('') : '<option value="">(nenhum cadastrado)</option>';
  if(window._recSrcInit && list.some(x=>x.id===window._recSrcInit)) sel.value=window._recSrcInit;
}
function saveRecurring(id){
  const d=currentData();
  const name=document.getElementById('rName').value.trim(); if(!name) return alert('Informe o nome.');
  const amount=parseFloat(document.getElementById('rAmount').value); if(!amount||amount<=0) return alert('Informe um valor válido.');
  const kind=document.getElementById('rKind').value==='income' ? 'income' : 'expense';
  const frequency=document.getElementById('rFreq').value;
  const startDate=document.getElementById('rStart').value; if(!startDate) return alert('Informe a data.');
  const endDate=document.getElementById('rEnd').value||'';
  if(endDate && endDate<startDate) return alert('A data de término deve ser depois da primeira data.');
  const sourceType = kind==='income' ? 'account' : document.getElementById('rSrcType').value;
  const sourceId=document.getElementById('rSrc').value;
  if(!sourceId) return alert(sourceType==='card' ? 'Cadastre um cartão primeiro.' : 'Cadastre uma conta primeiro.');
  const categoryId=document.getElementById('rCat').value;
  if(id){
    const r=d.recurring.find(x=>x.id===id); if(!r) return closeModal();
    const scheduleChanged = r.startDate!==startDate || r.frequency!==frequency || (r.endDate||'')!==endDate;
    Object.assign(r,{name,amount,kind,frequency,startDate,endDate,sourceType,sourceId,categoryId});
    if(scheduleChanged && !r.paused) skipRecurringUpToToday(r);   // nova agenda vale daqui pra frente
  } else {
    const r={id:uid(),name,amount,kind,frequency,startDate,endDate,sourceType,sourceId,categoryId,paused:false,launched:[]};
    if(!document.getElementById('rPast').checked){   // não lançar o passado: só de hoje em diante
      const today=todayISO(); r.launched=recOccurrences(r,today).filter(x=>x<today);
    }
    d.recurring.push(r);
  }
  processRecurring(); persist(); closeModal(); render();
}
function toggleRecurring(id){
  const d=currentData(); const r=d.recurring.find(x=>x.id===id); if(!r) return;
  r.paused=!r.paused;
  if(!r.paused) skipRecurringUpToToday(r);   // ao retomar, não lança o que passou durante a pausa
  persist(); render();
}
function deleteRecurring(id){
  const d=currentData(); const r=d.recurring.find(x=>x.id===id); if(!r) return;
  if(!confirm('Excluir "'+r.name+'"? Os lançamentos que já foram feitos continuam nas transações/faturas.')) return;
  withUndo('Recorrente excluída', ()=>{ d.recurring=d.recurring.filter(x=>x.id!==id); persist(); render(); });
}

/* ============================================================
   RELATÓRIOS: comparativo por categoria, maiores gastos, exportar CSV e PDF
   (Números de despesa seguem o Dashboard: só transações. Compras no cartão
   entram se marcar "Incluir compras no cartão", pelo mês da fatura.)
   ============================================================ */
const REP = {range:6, cards:true};   // cartão entra por padrão: bate com o Dashboard
function repMonths(){
  const v=viewYM();
  return Array.from({length:REP.range},(_,k)=>{
    const i=REP.range-1-k, dt=new Date(v.y, v.m-1-i, 1), y=dt.getFullYear(), m=dt.getMonth()+1;
    return {y,m,key:ymKey(y,m)};
  });
}
function repMLabel(mm){ return monthName(mm.m)+'/'+String(mm.y).slice(2); }
function repData(){
  const d=currentData(), months=repMonths(), idx={};
  months.forEach((mm,i)=>{ idx[mm.key]=i; });
  const inc=months.map(()=>0), exp=months.map(()=>0), cats={};
  const addExp=(catId,i,amt)=>{ exp[i]+=amt; (cats[catId]=cats[catId]||months.map(()=>0))[i]+=amt; };
  d.transactions.forEach(t=>{
    const i=idx[t.date.slice(0,7)]; if(i===undefined) return;
    if(t.type==='income') inc[i]+=t.amount; else addExp(t.categoryId||'_none',i,t.amount);
  });
  if(REP.cards) d.cardInstallments.forEach(x=>{
    const i=idx[ymKey(x.invoiceYear,x.invoiceMonth)]; if(i===undefined) return;
    addExp(x.categoryId||'_none',i,x.amount);
  });
  const rows=Object.entries(cats).map(([id,arr])=>{
    const c=d.categories.find(c=>c.id===id), total=arr.reduce((a,b)=>a+b,0);
    return {id, name:c?c.name:'Sem categoria', color:c?c.color:'#8A94A6', arr, total, avg:total/months.length};
  }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  return {months,inc,exp,rows};
}
/* Variação do último mês contra o anterior (para despesas: subir é ruim) */
function repVar(arr){
  const n=arr.length; if(n<2) return {t:'—',cls:''};
  const p=arr[n-2], l=arr[n-1];
  if(p===0 && l===0) return {t:'—',cls:''};
  if(p===0) return {t:'novo',cls:'down'};
  const pct=(l-p)/p*100;
  if(Math.abs(pct)<0.5) return {t:'0%',cls:''};
  return {t:(pct>0?'▲ ':'▼ ')+Math.abs(pct).toFixed(0)+'%', cls:pct>0?'down':'up'};
}
function repChange(){
  REP.range=parseInt(document.getElementById('repRange').value)||6;
  REP.cards=document.getElementById('repCards').checked;
  render();
}
function repTopSpends(lastKey){
  const d=currentData(), spends=[];
  d.transactions.forEach(t=>{ if(t.type==='expense' && t.date.slice(0,7)===lastKey) spends.push({date:t.date,desc:t.description,cat:t.categoryId,amount:t.amount,src:accNameById(t.accountId)}); });
  if(REP.cards) d.cardInstallments.forEach(x=>{ if(ymKey(x.invoiceYear,x.invoiceMonth)===lastKey)
    spends.push({date:x.purchaseDate||(lastKey+'-01'),desc:x.description+(x.totalInstallments>1?' ('+x.installmentNumber+'/'+x.totalInstallments+')':''),cat:x.categoryId,amount:x.amount,src:(d.cards.find(c=>c.id===x.cardId)||{}).name||'Cartão'}); });
  return spends.sort((a,b)=>b.amount-a.amount).slice(0,10);
}

  el.innerHTML = `
    <div class="print-only" style="margin-bottom:12px"><h2 style="margin:0 0 4px">Controlla — Relatório financeiro</h2><div>Período: ${periodTxt}${REP.cards?' · inclui compras no cartão':''}</div></div>
    <div class="row-between"><div><h1 class="page-title">Relatórios</h1><p class="page-sub">${periodTxt}</p></div></div>

      <div class="card kpi"><div class="kpi-label">Despesas: último mês vs anterior</div><div class="kpi-value ${tv.cls}" style="font-size:18px">${tv.t}</div><div class="kpi-delta small-muted">${repMLabel(last)} vs ${n>1?repMLabel(months[n-2]):'—'}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="font-weight:700;margin-bottom:10px">Despesas por categoria, mês a mês</div>
      ${rows.length===0 ? '<div class="empty">Sem despesas neste período</div>' : `
      <div class="rep-wrap"><table class="rep-table"><thead><tr><th>Categoria</th>${months.map(mm=>`<th>${repMLabel(mm)}</th>`).join('')}<th>Total</th><th>Média</th><th>Variação</th></tr></thead><tbody>
        ${rows.map(r=>{ const v=repVar(r.arr); return `<tr><td><span class="dot" style="background:${r.color}"></span>${escapeHtml(r.name)}</td>${r.arr.map(x=>`<td>${money(x)}</td>`).join('')}<td><b>${fmtMoney(r.total)}</b></td><td>${fmtMoney(r.avg)}</td><td class="${v.cls}">${v.t}</td></tr>`; }).join('')}
        <tr class="sum"><td>Despesas</td>${exp.map(x=>`<td>${money(x)}</td>`).join('')}<td>${fmtMoney(totExp)}</td><td>${fmtMoney(totExp/n)}</td><td class="${tv.cls}">${tv.t}</td></tr>
        <tr><td>Receitas</td>${inc.map(x=>`<td class="up">${money(x)}</td>`).join('')}<td class="up">${fmtMoney(totInc)}</td><td>${fmtMoney(totInc/n)}</td><td></td></tr>
        <tr class="sum"><td>Saldo</td>${inc.map((x,i)=>{ const b=x-exp[i]; return `<td class="${b<0?'down':'up'}">${fmtMoney(b)}</td>`; }).join('')}<td class="${bal<0?'down':'up'}">${fmtMoney(bal)}</td><td>${fmtMoney(bal/n)}</td><td></td></tr>
      </tbody></table></div>`}
      ${REP.cards ? '' : '<div class="small-muted no-print" style="margin-top:10px">Sem somar as compras no cartão, estes números ficam diferentes do Dashboard. Marque "Incluir compras no cartão" para somá-las pelo mês da fatura.</div>'}
    </div>

      <div style="font-weight:700;margin-bottom:10px">Maiores gastos de ${monthFull(last.m).toLowerCase()} de ${last.y}</div>

        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ink-850);font-size:13.5px">
          <span style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">${escapeHtml(s.desc)}</b><span class="small-muted" style="display:block">${fmtDate(s.date)}${c?' · '+escapeHtml(c.name):''} · ${escapeHtml(s.src)}</span></span>
          <b class="down" style="white-space:nowrap">${fmtMoney(s.amount)}</b></div>`; }).join('')}
    </div>
    <div class="card no-print">
      <div style="font-weight:700;margin-bottom:10px">Exportar</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline" style="width:auto;padding:10px 16px" onclick="exportReportTx()">Lançamentos (CSV)</button>

}
/* ---- exportação ---- */
function csvCell(v){ const s=String(v==null?'':v); return /[;"\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function csvNum(n){ return (Math.round(n*100)/100).toFixed(2).replace('.',','); }
function csvFromRows(rows){ return '\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'); }
function downloadText(filename,text,mime){
  const blob=new Blob([text],{type:mime||'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function reportTxRows(){
  const d=currentData(), months=repMonths(), from=months[0].key+'-01', to=months[months.length-1].key+'-31';
  const rows=[];
  d.transactions.forEach(t=>{ if(t.date<from||t.date>to) return;
    const c=d.categories.find(c=>c.id===t.categoryId);
    rows.push([t.date,t.description,t.type==='income'?'Receita':'Despesa',c?c.name:'',accNameById(t.accountId),csvNum(t.type==='income'?t.amount:-t.amount)]); });
  (d.transfers||[]).forEach(t=>{ if(t.date<from||t.date>to) return;
    rows.push([t.date,t.description||'Transferência','Transferência','',accNameById(t.fromId)+' → '+accNameById(t.toId),csvNum(t.amount)]); });
  if(REP.cards){ const keys=new Set(months.map(m=>m.key));
    d.cardInstallments.forEach(x=>{ if(!keys.has(ymKey(x.invoiceYear,x.invoiceMonth))) return;
      const c=d.categories.find(c=>c.id===x.categoryId), card=d.cards.find(k=>k.id===x.cardId);
      rows.push([x.purchaseDate||ymKey(x.invoiceYear,x.invoiceMonth)+'-01',x.description+(x.totalInstallments>1?' ('+x.installmentNumber+'/'+x.totalInstallments+')':'')+' [fatura '+monthName(x.invoiceMonth)+'/'+String(x.invoiceYear).slice(2)+']','Despesa (cartão)',c?c.name:'',card?card.name:'Cartão',csvNum(-x.amount)]); }); }
  rows.sort((a,b)=>a[0].localeCompare(b[0]));
  return [['Data','Descrição','Tipo','Categoria','Conta/Cartão','Valor']].concat(rows);
}
function reportCompareRows(){
  const {months,inc,exp,rows}=repData(), n=months.length;
  const head=['Categoria'].concat(months.map(repMLabel),['Total','Média mensal','Variação último mês']);
  const out=[head];
  rows.forEach(r=>out.push([r.name].concat(r.arr.map(csvNum),[csvNum(r.total),csvNum(r.avg),repVar(r.arr).t])));
  const te=exp.reduce((a,b)=>a+b,0), ti=inc.reduce((a,b)=>a+b,0);
  out.push(['Despesas'].concat(exp.map(csvNum),[csvNum(te),csvNum(te/n),repVar(exp).t]));
  out.push(['Receitas'].concat(inc.map(csvNum),[csvNum(ti),csvNum(ti/n),'']));
  out.push(['Saldo'].concat(inc.map((x,i)=>csvNum(x-exp[i])),[csvNum(ti-te),csvNum((ti-te)/n),'']));
  return out;
}
function repFileTag(){ const m=repMonths(); return m[0].key+'_a_'+m[m.length-1].key; }
function exportReportTx(){ downloadText('controlla-lancamentos-'+repFileTag()+'.csv', csvFromRows(reportTxRows())); }
function exportReportCompare(){ downloadText('controlla-comparativo-'+repFileTag()+'.csv', csvFromRows(reportCompareRows())); }

function openBudgetModal(){
